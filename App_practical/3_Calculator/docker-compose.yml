version: '3.8'

services:
  mariadb:
    container_name: web-mariadb-3
    hostname: mariadb
    image: mariadb:10.5
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: 3WebCalculatorDb
      MARIADB_USER: webdb
      MARIADB_PASSWORD: password
    ports:
      - "0.0.0.0:5333:3306"
    networks:
      - app-network

  web:
    container_name: web-app-calculator
    hostname: app
    build: 3_Calculator/
    ports:
      - "0.0.0.0:5003:5003"
    depends_on:
      - mariadb
    networks:
      - app-network
      - kafkanet  # <-- Подключаем к серверной сети Kafka

networks:
  app-network:
    driver: bridge
  kafkanet:
    external: true  # <-- Указываем, что сеть уже существует (создана для серверной Kafka)